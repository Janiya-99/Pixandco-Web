name: Deploy Staging

on:
  push:
    branches:
      - main

concurrency:
  group: pixandco-staging
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  deploy:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy files via rsync
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "/"
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          REMOTE_PORT: ${{ secrets.VPS_PORT || 22 }}
          TARGET: "/srv/apps/pixandco-staging"
          EXCLUDE: "/node_modules/, /.git/, /.github/"

      - name: Finish deployment on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail

            APP_DIR="/srv/apps/pixandco-staging"
            APP_NAME="pixandco-staging"

            echo "======================================"
            echo "Finishing Deployment for Pix & Co Staging"
            echo "======================================"

            cd "$APP_DIR"

            echo "[1/4] Installing dependencies..."
            npm ci

            echo "[2/4] Type checking..."
            npm run typecheck

            echo "[3/4] Building Next.js..."
            npm run build

            echo "[4/4] Restarting PM2..."
            pm2 restart "$APP_NAME" --update-env
            pm2 save

            echo "Waiting for application..."
            sleep 3

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000 || true)

            if [[ "$HTTP_CODE" =~ ^2|3 ]]; then
              echo "Health check passed: HTTP $HTTP_CODE"
            else
              echo "Health check FAILED: HTTP $HTTP_CODE"
              exit 1
            fi

            echo "Deployment completed successfully."
