name: Deploy Staging

on:
  push:
    branches:
      - main

concurrency:
  group: pixandco-staging
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build Next.js
        run: npm run build

  deploy:
    name: Deploy to Bluehost VPS
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 20m
          script: |
            set -e

            echo "Connected to VPS"
            echo "User: $(whoami)"
            echo "Host: $(hostname)"

            /srv/infrastructure/scripts/deploy-pixandco-staging.sh